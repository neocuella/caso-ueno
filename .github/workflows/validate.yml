name: Validar datos

# Revisa los aportes en cada pull request. En main no hace falta: el flujo Publicar
# construye la página, y la construcción valida los datos antes de publicar.
on:
  pull_request:
    paths: ["data/**", "scripts/**", "site/**", ".github/workflows/validate.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar CSV
        run: node scripts/validate.js
      - name: Construir la página
        run: node scripts/build.js --json
