name: Validar datos

on:
  pull_request:
    paths: ["data/**", "scripts/**", "site/**", ".github/workflows/validate.yml"]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar CSV
        run: node scripts/validate.js
      - name: Construir la página
        run: node scripts/build.js --json
