name: Publicar

# Publica la página en caso-ueno.rickovelar.com cada vez que cambia main.
# `wrangler deploy` corre `npm run build`, que valida los datos: si hay errores, no se publica nada.
on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "site/**", "package.json", "wrangler.jsonc", ".github/workflows/deploy.yml"]
  workflow_dispatch:

# una publicación a la vez; si llega otra, espera a que termine la anterior
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          command: deploy
